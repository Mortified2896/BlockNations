<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#314d79">
  <title>Block Nations</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#314d79; font-family:system-ui,sans-serif; color:white; }
    #game { width:100%; height:100%; height:100dvh; position:relative; }
    canvas { display:block; width:100%; height:100%; touch-action:none; outline:none; }
    #loading { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:1rem; padding:2rem; background:#314d79; text-align:center; }
    #loading h1 { margin:0; font-size:2rem; }
    progress { width:min(75vw,25rem); }
    #status { max-width:35rem; line-height:1.5; }
  </style>
</head>
<body>
  <main id="game">
    <canvas id="unity-canvas" tabindex="0" aria-label="Block Nations game"></canvas>
    <div id="loading" role="status"><h1>Block Nations</h1><div id="status">Loading the game…</div><progress id="progress" max="1" value="0"></progress></div>
  </main>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const config = {
      dataUrl: 'Build/{{{ DATA_FILENAME }}}',
      frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: 'Build/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      matchWebGLToCanvasSize: true,
      autoSyncPersistentDataPath: true,
      showBanner: (message, type) => {
        if (type === 'error') document.getElementById('status').textContent = message;
        else console.warn(message);
      }
    };
    createUnityInstance(canvas, config, p => document.getElementById('progress').value = p)
      .then(instance => {
        window.blockNations = instance;
        document.getElementById('loading').style.display = 'none';
        canvas.focus();
      }).catch(error => {
        document.getElementById('status').textContent = 'The game could not load: ' + String(error);
        document.getElementById('progress').style.display = 'none';
      });
  </script>
</body>
</html>
